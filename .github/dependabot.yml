version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      next-eslint:
        patterns:
          - 'next'
          - 'eslint*'
          - 'eslint-config-next'
