# Typecheck, lint gate, production build (placeholder env), and Playwright for web/
name: Web CI

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'knowledge/**'
      - '.github/workflows/web-ci.yml'
      - '.github/dependabot.yml'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - '.editorconfig'
  pull_request:
    paths:
      - 'web/**'
      - 'knowledge/**'
      - '.github/workflows/web-ci.yml'
      - '.github/dependabot.yml'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - '.editorconfig'

env:
  # Placeholders so `next build` and `next dev` (Playwright) never require a committed .env.
  # Override with GitHub Actions secrets/vars if you add a matching Environment later.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder_000000000000000000000000
  STRIPE_SECRET_KEY: sk_test_ci_placeholder_00000000000000000000000000000000
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_00000000000000000000000000000000
  FAN_VAULT_UNLOCK_SECRET: ci-fan-vault-unlock-32chars-minimum!
  NEXTAUTH_SECRET: ci-nextauth-secret-32chars-minimum-here!!
  NEXTAUTH_URL: http://127.0.0.1:3001
  RESEND_API_KEY: re_ci_placeholder_000000000000000000000000
  CRON_SECRET: ci-cron-placeholder-secret-min-16
  PRINTFUL_API_KEY: ci_printful_api_key_placeholder_00000000
  PRINTFUL_STORE_ID: '0'
  PRINTFUL_WEBHOOK_SECRET: whsec_ci_printful_placeholder_0000000000000000
  NEXT_PUBLIC_ENABLE_CAMPAIGNS: 'true'
  NEXT_PUBLIC_ENABLE_MISSIONS: 'false'
  NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Site knowledge snapshot (routes + E2E crawl drift)
        run: npm run knowledge:verify

  lint-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint (lint gate — Stripe, auth, Supabase, vault, middleware, Sentry, music-library)
        run: npm run lint:gate

  npm-audit:
    needs: [typecheck, lint-gate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: npm audit (production deps, high or critical only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint-gate]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            next-build-${{ runner.os }}-
      - run: npm ci
      - name: Production build (Vercel path)
        run: npm run vercel:build

  playwright:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web-ci
          path: web/playwright-report
          retention-days: 7

  production-health-probe:
    name: Production health probe
    needs: [playwright]
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_HEALTHCHECK_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Probe /api/health/deps
        run: npm run health:probe -- "${{ vars.PRODUCTION_HEALTHCHECK_URL }}"
